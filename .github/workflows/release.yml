name: Release

# Tag a version (git tag v0.1.0 && git push --tags) to build salu for every platform and
# attach the binaries to a GitHub release. scripts/install.sh downloads from there; the box installer
# (install-box.sh) downloads salu-box-linux-<arch>.tar.gz, one bundle with everything a box needs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build binaries (bun cross-compiles every target from one runner)
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun build --compile --minify --splitting --target="bun-$t" src/index.ts --outfile "dist/salu-$t"
            (cd dist && sha256sum "salu-$t" > "salu-$t.sha256")
          done
          ls -lh dist
      - name: Build the box bundles (salu + installer scripts + kernel Containerfile; the installer downloads one of these)
        run: |
          # the Containerfile is written by the binary, so each bundle takes it from the x64 build (it does not depend on the CPU)
          dist/salu-linux-x64 kernel containerfile > dist/Containerfile
          for a in x64 arm64; do SALU_BUNDLE_VERSION="$TAG" scripts/build-box-bundle.sh "dist/salu-linux-$a" "$a" dist --containerfile dist/Containerfile; done
          rm dist/Containerfile   # only needed to build the bundles
          cp scripts/install-box.sh dist/install-box.sh
          ls -lh dist/salu-box-*
      - name: Checksums of everything in the release. Signed here only if a SALU_RELEASE_KEY secret exists (unused: the key lives on the owner's Mac, salu release sign <tag>)
        env:
          SALU_RELEASE_KEY: ${{ secrets.SALU_RELEASE_KEY }}
        run: |
          (cd dist && sha256sum salu-* install-box.sh > SHA256SUMS)
          if [ -n "$SALU_RELEASE_KEY" ]; then dist/salu-linux-x64 release sign dist; fi
      - name: Test the compiled linux-x64 binary end to end (stub claude on PATH, and none)
        run: SALU_E2E_BIN=dist/salu-linux-x64 bun test test/e2e
      - name: Publish release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "release-notes/$TAG.md" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "release-notes/$TAG.md"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/salu-* dist/install-box.sh dist/SHA256SUMS --clobber
          for f in dist/SHA256SUMS.sig dist/install-box.sh.sig; do [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber || true; done
