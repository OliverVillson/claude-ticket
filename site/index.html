<h1>salu</h1>
<p>A ticket queue for Claude Code agents. Install on a Mac or Linux:</p>
<pre>curl -fsSL https://olivervillson.github.io/salu/i | bash</pre>
<p>Then <code>salu box add user@host</code> and <code>salu new myapp</code>.
Docs: <a href="https://github.com/OliverVillson/salu/blob/main/docs/quickstart.md">quickstart</a>.</p>
