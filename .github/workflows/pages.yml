name: Pages

# Publishes https://olivervillson.github.io/salu/i (the CLI installer) and /box (the box installer).
# One-time switch: repo Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [scripts/install.sh, scripts/install-box.sh, site/**, scripts/build-site.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
