name: SaluPhone
options:
  bundleIdPrefix: dev.salu
  deploymentTarget:
    iOS: "17.0"
targets:
  SaluPhone:
    type: application
    platform: iOS
    sources: [SaluPhone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.salu.phone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Salu
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
